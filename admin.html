<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>管理者後台｜服務衝突檢查系統</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./config.js"></script>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow">ADMIN</div>
      <h1>管理者後台</h1>
    </div>
    <div class="btn-group">
      <button id="btnBack">返回系統</button>
      <button id="btnAdminLogout">登出</button>
    </div>
  </section>

  <section id="adminDenied" class="card hidden">
    <h2>無法進入管理者後台</h2>
    <p id="adminDeniedText" class="muted"></p>
  </section>

  <div id="adminContent" class="hidden">
    <section class="card">
      <div class="section-head">
        <div>
          <div class="card-kicker">MEMBERS</div>
          <h2>會員管理</h2>
        </div>
        <button id="btnRefreshUsers">重新整理</button>
      </div>
      <div class="issue-table-wrap">
        <table class="issue-table admin-table">
          <thead>
            <tr>
              <th>Email</th>
              <th>信箱</th>
              <th>試用</th>
              <th>付費期限</th>
              <th>權限</th>
              <th>狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<script src="./admin.js"></script>
</body>
</html>
