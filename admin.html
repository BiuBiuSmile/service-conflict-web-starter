<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>管理者後台｜服務衝突檢查系統</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./config.js"></script>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow">ADMIN</div>
      <h1>管理者後台</h1>
    </div>
    <div class="btn-group">
      <button id="btnBack">返回系統</button>
      <button id="btnAdminLogout">登出</button>
    </div>
  </section>

  <section id="adminDenied" class="card hidden">
    <h2>無法進入管理者後台</h2>
    <p id="adminDeniedText" class="muted"></p>
  </section>

  <div id="adminContent" class="hidden">
    <section class="card">
      <div class="section-head">
        <div>
          <div class="card-kicker">MEMBERS</div>
          <h2>會員管理</h2>
        </div>
        <button id="btnRefreshUsers">重新整理</button>
      </div>
      <div class="admin-summary-bar">
        <div class="admin-summary-item">
          <span class="admin-summary-label">會員總數</span>
          <strong id="memberCount">0</strong>
        </div>
        <div class="admin-summary-item">
          <span class="admin-summary-label">付費會員</span>
          <strong id="paidCount">0</strong>
        </div>
        <div class="admin-summary-item">
          <span class="admin-summary-label">試用中</span>
          <strong id="trialCount">0</strong>
        </div>
      </div>
      <div class="issue-table-wrap admin-table-wrap">
        <table class="issue-table admin-table">
          <thead>
            <tr>
              <th>Email</th>
              <th>信箱</th>
              <th>試用</th>
              <th>付費期限</th>
              <th>權限</th>
              <th>狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <div>
          <div class="card-kicker">PAYMENTS</div>
          <h2>付款紀錄</h2>
          <p class="muted payment-admin-note">可使用「商店訂單編號」到綠界 Stage／正式後台精準搜尋訂單。</p>
        </div>
        <button id="btnRefreshPayments">重新整理付款</button>
      </div>

      <div class="admin-summary-bar payment-summary-bar">
        <div class="admin-summary-item">
          <span class="admin-summary-label">付款紀錄</span>
          <strong id="paymentCount">0</strong>
        </div>
        <div class="admin-summary-item">
          <span class="admin-summary-label">已付款</span>
          <strong id="paymentPaidCount">0</strong>
        </div>
        <div class="admin-summary-item">
          <span class="admin-summary-label">待付款／未回呼</span>
          <strong id="paymentPendingCount">0</strong>
        </div>
      </div>

      <div class="issue-table-wrap admin-table-wrap">
        <table class="issue-table admin-table payment-table">
          <thead>
            <tr>
              <th>建立時間</th>
              <th>使用者</th>
              <th>金額</th>
              <th>商店訂單編號</th>
              <th>綠界交易編號</th>
              <th>付款狀態</th>
              <th>付款時間</th>
            </tr>
          </thead>
          <tbody id="paymentRows"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<script src="./admin.js"></script>
</body>
</html>
