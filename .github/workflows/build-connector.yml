name: Build Windows Connector

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "connector.py"
      - "requirements.txt"
      - "ServiceConflictConnector.spec"
      - "version_info.txt"
      - ".github/workflows/build-connector.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify dependencies
        shell: pwsh
        run: |
          python -c "import requests, flask, flask_cors, tkinter, websocket; print('Dependencies OK')"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm ServiceConflictConnector.spec

      - name: Test EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ServiceConflictConnector.exe")) {
            throw "Connector EXE was not created."
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServiceConflictConnector
          path: dist/ServiceConflictConnector.exe

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: connector-latest
          name: Service Conflict Connector Latest
          prerelease: false
          make_latest: true
          files: dist/ServiceConflictConnector.exe
          body: |
            Windows 服務衝突連線器 v0.4.1。
            已接入照管 QD120A 真實服務紀錄與自動登入狀態偵測。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
