name: Build Windows Connector

on:
  workflow_dispatch:
  push:
    paths:
      - "connector/**"
      - "ServiceConflictConnector.spec"
      - ".github/workflows/build-connector.yml"
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r connector/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm ServiceConflictConnector.spec

      - name: Test EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ServiceConflictConnector.exe")) {
            throw "Connector EXE was not created."
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServiceConflictConnector
          path: dist/ServiceConflictConnector.exe

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: connector-latest
          name: Service Conflict Connector Latest
          prerelease: false
          make_latest: true
          files: dist/ServiceConflictConnector.exe
          body: |
            Windows 服務衝突連線器。
            下載後直接開啟即可，不需要 Python 或 CMD。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
